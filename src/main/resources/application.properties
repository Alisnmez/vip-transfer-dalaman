spring.application.name=vip-transfer-dalaman
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vip_transfer_dalaman}
spring.datasource.username=${DB_USERNAME:ali}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# Set ADMIN_PASSWORD in the deployment environment to enable admin access.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# Set to the public Render frontend URL after creation.
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.port=${PORT:8080}

# Email verification is disabled until SMTP credentials and a sender are configured.
app.support.email.enabled=${SUPPORT_EMAIL_ENABLED:false}
app.support.email.from=${SUPPORT_EMAIL_FROM:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
