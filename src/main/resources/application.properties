spring.application.name=vip-transfer-dalaman
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vip_transfer_dalaman}
spring.datasource.username=${DB_USERNAME:ali}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# Set ADMIN_PASSWORD in the deployment environment to enable admin access.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# Set to the public Render frontend URL after creation.
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.port=${PORT:8080}


# Enable only after reviewing and baselining the existing database schema.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Keep disabled until sender DNS and authorized recipient tests pass.
app.email.enabled=${EMAIL_ENABLED:false}
app.email.api-key=${EMAIL_API_KEY:}
app.email.from=${EMAIL_FROM:}
app.email.reply-to=${EMAIL_REPLY_TO:}
app.email.operator=${EMAIL_OPERATOR:}

app.email.provider=${EMAIL_PROVIDER:resend}
# Used only when EMAIL_PROVIDER=gmail. App password is entered directly in Render.
app.email.gmail-password=${EMAIL_GMAIL_APP_PASSWORD:}

# Sequential delivery: keep batches small and inspect the queue frequently.
app.email.poll-ms=${EMAIL_POLL_MS:2000}
app.email.batch-size=${EMAIL_BATCH_SIZE:5}
# Soft budget: finish any in-flight provider call before yielding.
app.email.max-run-ms=${EMAIL_MAX_RUN_MS:5000}

# Admin session cookie for separate HTTPS frontend/backend origins.
# Use SESSION_COOKIE_SECURE=false and SESSION_COOKIE_SAME_SITE=lax for local HTTP development.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}
server.servlet.session.timeout=8h
server.forward-headers-strategy=framework
