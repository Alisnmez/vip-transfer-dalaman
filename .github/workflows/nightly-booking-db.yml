name: Nightly isolated booking database tests

on:
  push:
    branches:
      - feature/booking-integration
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/nightly-booking-db.yml'
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-booking-db-tests
  cancel-in-progress: false

jobs:
  backend-postgres:
    name: Backend tests with disposable PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vip_transfer_dalaman
          POSTGRES_USER: vip_test
          POSTGRES_PASSWORD: vip_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip_test -d vip_transfer_dalaman"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vip_transfer_dalaman
      SPRING_DATASOURCE_USERNAME: vip_test
      SPRING_DATASOURCE_PASSWORD: vip_test_password
    steps:
      - name: Verify isolated PostgreSQL target before running tests
        run: |
          test "$SPRING_DATASOURCE_URL" = 'jdbc:postgresql://localhost:5432/vip_transfer_dalaman'
          test "$SPRING_DATASOURCE_USERNAME" = 'vip_test'
          test "$SPRING_DATASOURCE_PASSWORD" = 'vip_test_password'

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run isolated integration tests
        run: mvn -B test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
