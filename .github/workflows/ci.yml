name: Build checks

permissions:
  contents: read
  statuses: write

on:
  push:
    branches:
      - feature/booking-integration
  pull_request:
  workflow_dispatch:

# When commits arrive quickly, keep only the newest run for the same branch.
# The newest commit still receives the full frontend and backend checks.
concurrency:
  group: build-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React and TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies for high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Upload frontend test and build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-diagnostics
          path: |
            frontend/dist/
            frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish frontend test status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            *) STATE=error ;;
          esac
          curl --fail-with-body --retry 3 -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$COMMIT_SHA" \
            -d "$(jq -nc --arg state "$STATE" --arg url "$RUN_URL" '{state:$state,context:"frontend-lint-test-build",description:"React lint, tests and production build",target_url:$url}')"

  backend:
    name: Spring Boot PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vip_transfer_dalaman
          POSTGRES_USER: vip_test
          POSTGRES_PASSWORD: vip_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip_test -d vip_transfer_dalaman"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vip_transfer_dalaman
      SPRING_DATASOURCE_USERNAME: vip_test
      SPRING_DATASOURCE_PASSWORD: vip_test_password
    steps:
      - name: Verify disposable test database target
        run: |
          test "$SPRING_DATASOURCE_URL" = 'jdbc:postgresql://localhost:5432/vip_transfer_dalaman'
          test "$SPRING_DATASOURCE_USERNAME" = 'vip_test'
          test "$SPRING_DATASOURCE_PASSWORD" = 'vip_test_password'

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify PostgreSQL backup and disposable restore
        shell: bash
        env:
          DATABASE_URL: postgresql://vip_test:vip_test_password@localhost:5432/vip_transfer_dalaman
          RESTORE_DATABASE_URL: postgresql://vip_test:vip_test_password@localhost:5432/vip_restore_test
          BACKUP_DIR: ${{ runner.temp }}/pg-backups
          CONFIRM_DISPOSABLE_RESTORE: 'YES'
        run: |
          set -euo pipefail
          pg_dump --version
          pg_restore --version
          PGPASSWORD=vip_test_password psql -h localhost -U vip_test -d vip_transfer_dalaman -v ON_ERROR_STOP=1 -c 'CREATE TABLE backup_restore_probe (id integer PRIMARY KEY, marker text NOT NULL);'
          PGPASSWORD=vip_test_password psql -h localhost -U vip_test -d vip_transfer_dalaman -v ON_ERROR_STOP=1 -c "INSERT INTO backup_restore_probe VALUES (1, 'verified-backup');"
          bash scripts/backup-postgres.sh
          PGPASSWORD=vip_test_password psql -h localhost -U vip_test -d vip_transfer_dalaman -v ON_ERROR_STOP=1 -c 'CREATE DATABASE vip_restore_test;'
          BACKUP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -name '*.dump' -print -quit)"
          export BACKUP_FILE
          bash scripts/restore-test-postgres.sh
          marker="$(PGPASSWORD=vip_test_password psql -h localhost -U vip_test -d vip_restore_test -Atqc 'SELECT marker FROM backup_restore_probe WHERE id=1')"
          test "$marker" = 'verified-backup'
          echo 'Backup/restore round trip verified against disposable PostgreSQL database.'
      - run: mvn -B test
      - name: Preserve backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish backend test status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            *) STATE=error ;;
          esac
          curl --fail-with-body --retry 3 -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$COMMIT_SHA" \
            -d "$(jq -nc --arg state "$STATE" --arg url "$RUN_URL" '{state:$state,context:"backend-postgresql-tests",description:"Maven PostgreSQL integration tests",target_url:$url}')"
