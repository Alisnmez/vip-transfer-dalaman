name: Build checks

on:
  push:
    branches:
      - feature/booking-integration
  pull_request:
  workflow_dispatch:

# When commits arrive quickly, keep only the newest run for the same branch.
# The newest commit still receives the full frontend and backend checks.
concurrency:
  group: build-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React and TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Upload frontend test and build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-diagnostics
          path: |
            frontend/dist/
            frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Spring Boot PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vip_transfer_dalaman
          POSTGRES_USER: vip_test
          POSTGRES_PASSWORD: vip_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip_test -d vip_transfer_dalaman"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vip_transfer_dalaman
      SPRING_DATASOURCE_USERNAME: vip_test
      SPRING_DATASOURCE_PASSWORD: vip_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - name: Preserve backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
