name: Build checks

on:
  push:
    branches:
      - feature/booking-integration
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: React and TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Spring Boot PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vip_transfer_dalaman
          POSTGRES_USER: vip_test
          POSTGRES_PASSWORD: vip_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip_test -d vip_transfer_dalaman"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vip_transfer_dalaman
      SPRING_DATASOURCE_USERNAME: vip_test
      SPRING_DATASOURCE_PASSWORD: vip_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
