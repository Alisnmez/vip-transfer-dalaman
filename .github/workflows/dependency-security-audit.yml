name: Dependency security audit

on:
  push:
    branches:
      - feature/booking-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > production-audit.txt 2>&1
          code=$?
          cat production-audit.txt
          echo "Production audit exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::High or critical vulnerabilities found in production dependencies"
            exit 1
          fi
      - name: Report development dependency risks (non-blocking)
        if: always()
        shell: bash
        run: |
          npm audit --audit-level=high > development-audit.txt 2>&1 || true
          cat development-audit.txt
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-security-audit
          path: |
            frontend/production-audit.txt
            frontend/development-audit.txt
          if-no-files-found: warn
          retention-days: 14
