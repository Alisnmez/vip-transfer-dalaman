name: Comprehensive release quality gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'pom.xml'
      - '.github/workflows/release-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace errors and unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- 'src/**/*.java' 'frontend/src/**/*.ts' 'frontend/src/**/*.tsx'; then
            echo 'Unresolved conflict marker found'
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vip_transfer_dalaman
          POSTGRES_USER: vip_test
          POSTGRES_PASSWORD: vip_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip_test -d vip_transfer_dalaman"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vip_transfer_dalaman
      SPRING_DATASOURCE_USERNAME: vip_test
      SPRING_DATASOURCE_PASSWORD: vip_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-backend-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
