name: Temporary airport waiting browser smoke
on:
  pull_request:
    branches: [feature/booking-integration]
  push:
    branches: [test/airport-waiting-browser]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Mobile route and booking smoke
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch();
          const base = 'https://vip-transfer-dalaman-test.onrender.com';
          try {
            const page = await browser.newPage({viewport:{width:390,height:844},isMobile:true,deviceScaleFactor:2,hasTouch:true});
            await page.route('**/*', route => ['GET','HEAD','OPTIONS'].includes(route.request().method()) ? route.continue() : route.abort());
            await page.goto(base+'/routes/marmaris');
            await page.getByText('60 min free waiting after landing',{exact:true}).waitFor();
            assert.equal(await page.locator('span.material-symbols-outlined').filter({hasText:/^schedule$/}).count() > 0,true);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth <= innerWidth+1),true,'Mobile horizontal overflow');
            await page.screenshot({path:'mobile-route.png',fullPage:true});
            await page.getByRole('link',{name:'Request a transfer',exact:true}).click();
            await page.getByRole('combobox',{name:'Destination',exact:true}).waitFor();
            assert.match(await page.getByRole('combobox',{name:'Destination',exact:true}).inputValue(),/Marmaris/i);
            const date = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
            await page.locator('input[type=date]').first().fill(date);
            await page.locator('input[type=time]').first().fill('12:00');
            await page.locator('button[aria-pressed]').first().click();
            await page.screenshot({path:'mobile-booking.png',fullPage:true});
            console.log('Mobile route, waiting icon, destination prefill, date/time and vehicle selection passed; no reservation submitted.');
          } finally { await browser.close(); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-smoke-screenshots
          path: mobile-*.png
